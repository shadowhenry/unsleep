<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8faf8">
    <meta name="description" content="一个跨平台防止电脑或手机熄屏的小工具。">
    <title>UnSleep</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="status-panel" aria-live="polite">

        <header class="hero" >
          <img class="app-icon" src="icon.png" alt="">
          <div class="brand">
            <p class="eyebrow" data-i18n="eyebrow">Stay Awake</p>
            <h1>UnSleep</h1>
          </div>
        </header>

        <div id="statusBadge" class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">防睡眠已关闭</span>
        </div>

        <div class="timer" aria-label="防睡眠计时">
          <span class="timer-label" data-i18n="timerLabel">已保持清醒</span>
          <span id="elapsedTime" class="timer-value">00:00:00</span>
        </div>

        <button id="wakeToggle" class="switch-control" type="button" aria-label="防睡眠" aria-pressed="false">
          <span id="switchTrack" class="switch-track" aria-hidden="true" data-on-label="开" data-off-label="关">
            <span class="switch-thumb"></span>
          </span>
        </button>

        <p id="supportText" class="support-text">桌面模式准备就绪</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
